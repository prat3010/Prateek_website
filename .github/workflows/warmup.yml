name: Warm Retriever

on:
  schedule:
    # External canary only. The primary five-minute warm-up is the systemd
    # timer on the Oracle VM; GitHub scheduled workflows are often delayed.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  warm:
    name: Warm embedding, vector, Redis, and generation paths
    runs-on: ubuntu-latest
    steps:
      - name: Verify warmup secret is configured
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET repository secret is not configured."
            exit 1
          fi

      - name: Call warmup endpoint
        run: |
          curl -fsS --max-time 75 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://prateeq.in/api/cron/warmup
